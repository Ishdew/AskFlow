version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16  # Postgres 16 with pgvector pre-installed
    container_name: askflow_db
    environment:
      POSTGRES_USER: askflow_user
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: askflow_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine  # Broker/result store for Arq background jobs
    container_name: askflow_redis
    ports:
      - "6380:6379"
    # No volume: only transient job/result state, nothing worth persisting -
    # a lost job just means re-uploading that PDF.

volumes:
  postgres_data: